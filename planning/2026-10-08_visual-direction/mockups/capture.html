<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual study capture</title><style>html,body{margin:0;padding:0}iframe{display:block;border:0;margin:0}</style></head><body><iframe id="study-frame" title="Responsive visual study"></iframe><script type="module">
const params=new URL(location.href).searchParams;
const width=params.get('device')==='phone'?390:params.get('device')==='small'?320:params.get('device')==='current'?945:1440;
const frame=document.querySelector('iframe');
frame.style.width=`${width}px`;
frame.style.height=params.get('tall')==='true'?'2600px':width>=761?'1000px':'844px';
const source=new URL('index.html',location.href);
source.searchParams.set('direction',params.get('direction')==='workflow'?'workflow':'portrait');
for(const key of ['category','focus'])if(params.has(key))source.searchParams.set(key,params.get(key));
if(params.get('view')==='recruiter')source.searchParams.set('view','recruiter');
if(params.get('theme')==='dark')source.searchParams.set('theme','dark');
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='visual-study-ready')return;if(params.get('full')==='true')frame.style.height=`${frame.contentDocument.documentElement.scrollHeight}px`;frame.dataset.ready='true';});
source.searchParams.set('motion','off');
frame.src=source.href;
</script></body></html>
